<!DOCTYPE html>
<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Birthday with Gift Burst</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="birthday-audio" loop>
        <source src="audio.mp3" type="audio/mpeg">
        <source src="https://assets.mixkit.co/active_storage/sfx/123/123-200.wav" type="audio/wav">
        Your browser does not support the audio element.
    </audio>

    <div class="space-background">
        <div class="nebula"></div>
        <div class="stars" id="star-container"></div>
    </div>

    <div class="scene-container">
        
        <div class="balloon-cluster left-balloons">
            <div class="balloon metallic-silver"></div>
            <div class="balloon metallic-blue"></div>
            <div class="balloon metallic-gold"></div>
        </div>

        <div class="birthday-3d-text">
            <h1 class="text-3d row-1">HAPPY</h1>
            <h1 class="text-3d row-2">BIRTHDAY</h1>
        </div>

        <div class="balloon-cluster right-balloons">
            <div class="balloon metallic-red"></div>
            <div class="balloon metallic-blue-dark"></div>
            <div class="balloon metallic-silver-dark"></div>
        </div>

        <div class="toy-rocket">🚀</div>
        <div class="saturn-planet">🪐</div>
        <div class="ufo-saucer">🛸</div>

        <div class="furry-astronaut">
            <div class="fur-body">
                <div class="gold-helmet-visor"></div>
                <div class="arm arm-left"></div>
                <div class="arm arm-right"></div>
                <div class="leg leg-left"></div>
                <div class="leg leg-right"></div>
            </div>
        </div>

        <div class="ground-deco">
            <div class="gift-wrapper" id="gift-box-trigger">
                <div class="gift-emoji">🎁</div>
                <span class="click-me">Press Me!</span>
            </div>

            <div class="gold-star s-1">★</div>
            <div class="gold-star s-2">★</div>
            
            <div class="static-gift">🎁</div>
        </div>

    </div>

    <div class="photo-modal" id="photo-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-btn">&times;</span>
            
            <div class="frame-3d">
                <img id="birthday-person-img" src="my-pic.png" alt="Birthday Person">
            </div>

            <h3 class="wishing-tag">Happy Birthday to You! 🎉</h3>
        </div>
    </div>

    <div class="confetti-container" id="confetti-container"></div>

    <div class="music-tip">Tap/Click anywhere to play music! 🎵</div>

    <script src="script.js"></script>
</body>
</html>
